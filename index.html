<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Happy Diwali – Wishes from our Family</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Tiro+Devanagari+Hindi&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--w:min(66vw,320px);--h:calc(var(--w)*1.32)}
*{box-sizing:inherit}
html,body{margin:0}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 15%,#ffe27a 0%,#ffa83c 26%,#ec4f7e 60%,#6c1d9c 100%) fixed;color:#fff8e6;font-family:"Cormorant Garamond",Georgia,serif;text-align:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.rays{position:fixed;left:50%;top:-30vmax;width:160vmax;height:160vmax;margin-left:-80vmax;background:repeating-conic-gradient(from 0deg,#ffffff38 0 6deg,#ffffff00 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,#0000 55%);mask:radial-gradient(circle,#000 0,#0000 55%);animation:spin 90s linear infinite;pointer-events:none}
.bokeh{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bokeh i{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle,#fff9 0,#ffd66b66 45%,#0000 70%);animation:float linear infinite}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.lights{position:relative;height:74px;z-index:2}
.lights::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:#5a2a00aa}
.bulb{position:absolute;width:12px;height:18px;border-radius:50% 50% 55% 55%;transform:translateX(-50%);animation:tw 1.4s ease-in-out infinite alternate}
main{position:relative;z-index:2;padding:0 12px 40px}
.top{font-family:"Tiro Devanagari Hindi",serif;font-size:1.6rem;color:#fff;text-shadow:0 0 14px #ffd54a,0 2px 4px #8a2a0a}
h1{font-family:"Cinzel Decorative",serif;font-size:clamp(2.1rem,9vw,4.4rem);margin:6px 0 0;color:#fffaf0;text-shadow:0 0 18px #ffd54a,0 0 40px #ff9d2e,0 4px 0 #b3490e,0 8px 14px #6b1a0a88}
.script{font-family:"Great Vibes",cursive;font-size:clamp(1.9rem,7vw,3.2rem);color:#fff;margin:2px 0 0;text-shadow:0 0 16px #ff5f9a,0 2px 4px #7a1030}
.stage{position:relative;height:calc(var(--h) + 90px);perspective:1300px;margin:12px auto 0;max-width:1000px;touch-action:pan-y;user-select:none}
.floor{position:absolute;left:50%;bottom:6px;width:80%;height:70px;transform:translateX(-50%);background:radial-gradient(ellipse,#fff7c4cc 0,#ffd54a66 40%,#0000 70%);filter:blur(6px)}
.ring{position:absolute;inset:0;transform-style:preserve-3d}
.slide{position:absolute;left:50%;top:10px;width:var(--w);height:var(--h);margin-left:calc(var(--w)/-2);padding:7px;border-radius:14px;background:linear-gradient(135deg,#fff7c2,#f2b21c 40%,#a45a0a 60%,#ffe27a);box-shadow:0 18px 40px #3d0a2caa,0 0 30px #ffd54a99;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s,filter .9s;-webkit-box-reflect:below 6px linear-gradient(transparent 70%,#ffffff44);cursor:pointer}
.slide img{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px;pointer-events:none}
.slide.c{box-shadow:0 22px 50px #3d0a2cbb,0 0 60px #fff2a8,0 0 120px #ffb300}
.nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px}
.nav button{width:46px;height:46px;border-radius:50%;border:2px solid #fff8;background:#ffffff30;color:#fff;font-size:1.4rem;cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 0 16px #ffd54a88}
.dots{display:flex;gap:7px}.dots b{width:9px;height:9px;border-radius:50%;background:#fff6;transition:.3s}.dots b.on{background:#fff;box-shadow:0 0 10px #fff,0 0 18px #ffd54a;transform:scale(1.35)}
.wish{position:relative;margin:34px auto 0;max-width:660px;padding:26px 20px 22px;border-radius:22px;background:linear-gradient(160deg,#ffffff40,#ffffff18);border:1px solid #fff9;box-shadow:0 0 40px #ffd54a88,inset 0 0 30px #ffffff30;backdrop-filter:blur(6px)}
.wish h2{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.2rem,8vw,3.2rem);margin:0 0 6px;color:#fff;text-shadow:0 0 16px #ffd54a,0 2px 4px #8a2a0a}
.wish p{font-size:1.35rem;font-style:italic;line-height:1.5;margin:0 0 16px;text-shadow:0 1px 3px #6b1a0a99}
.names{font-family:"Cinzel Decorative",serif;font-size:clamp(1rem,3.8vw,1.3rem);line-height:2;text-shadow:0 0 10px #ffd54a,0 2px 3px #6b1a0a}
.names span{display:block}
.lb{position:fixed;inset:0;background:#1a0420e6;display:none;align-items:center;justify-content:center;z-index:9;padding:16px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 0 80px #ffb300}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{from{opacity:.55;filter:brightness(.9)}to{opacity:1;filter:brightness(1.4)}}
@keyframes float{to{transform:translateY(-120vh)}}
